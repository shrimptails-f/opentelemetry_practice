services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    init: true
    command: sleep infinity
    working_dir: /workspace/opentelemetry-practice
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
    depends_on:
      - order-api
    volumes:
      - .:/workspace/opentelemetry-practice
      - ${HOME}/.aws:/home/dev/.aws:ro
      - ${HOME}/.config/gh:/home/dev/.config/gh:ro
      - go-modules:/home/dev/go/pkg/mod
      - ${HOME}/.codex:/home/dev/.codex
      - ${HOME}/.claude:/home/dev/.claude

volumes:
  go-modules:
