services:
  order-api:
    build: .
    environment:
      SERVICE_NAME: order-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [collector, inventory-api]
  inventory-api:
    build: .
    environment:
      SERVICE_NAME: inventory-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on: [collector]
  collector:
    image: otel/opentelemetry-collector:0.132.0
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
